omething about the world and had an impact on its history", "chunk_id": [2], "id": "world_recreation", "name": "World Recreation", "states": [], "type": "event"}, "font": {"color": "white"}, "id": "world_recreation", "label": "World Recreation", "shape": "dot"}]);

};

            <style>
            #infoPanel {
                position: fixed;
                top: 20px;
                right: 20px;
                max-width: 600px;
                background: #1e1e1e;
                color: white;
                padding: 16px;
                border-radius: 8px;
                border: 1px solid #444;
                font-family: Consolas, monospace;
                font-size: 13px;
                display: none;
                z-index: 9999;
                white-space: pre-wrap;
            }
            #infoPanel h3 {
                margin: 0 0 10px 0;
                font-size: 15px;
            }
            </style>
            <div id="infoPanel"></div>
            <script>
            function showPanel(title, data) {
                const panel = document.getElementById("infoPanel");
                panel.style.display = "block";
                panel.innerHTML = "<h3>" + title + "</h3>" +
                                "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
            }

            function hidePanel() {
                document.getElementById("infoPanel").style.display = "none";
            }
            setTimeout(() => {
                if (!window.network) return;
                network.on("click", function (params) {
                    if (params.nodes.length === 0 && params.edges.length === 0) {
                        hidePanel();
                        return;
                    }
                    if (params.nodes.length === 1) {
                        const nodeId = params.nodes[0];
                        const node = network.body.data.nodes.get(nodeId);
                        showPanel("Node: " + nodeId, node.data || {});
                        return;
                    }
                    if (params.edges.length === 1) {
                        const edgeId = params.edges[0];
                        const edge = network.body.data.edges.get(edgeId);
                        showPanel("Edge: " + edge.from + " → " + edge.to, edge.data || {});
                        return;
                    }
                });

            }, 300);
            </script>
