k_id": [0], "id": "elden_ring", "name": "Elden Ring", "states": [{"current_attributes": {}, "current_description": "The Elden Ring is intact, the physical manifestation of the Greater Will\u0027s power, made up of disparate runes, and the source of the Erdtree\u0027s power.", "sid": "state_elden_ring_001", "time_end_event": "shattering", "time_start_event": null}, {"current_attributes": {}, "current_description": "The Elden Ring is shattered into pieces. Its runes are scattered and held by various demigods. The Greater Will\u0027s influence is fading.", "sid": "state_elden_ring_002", "time_end_event": null, "time_start_event": "shattering"}], "type": "item"}, "font": {"color": "white"}, "id": "elden_ring", "label": "Elden Ring", "shape": "dot"}, {"color": "#ffa94d", "data": {"base_attributes": {}, "base_description": "The Two Fingers are literal emissaries that try to enact the desires of the Greater Will.", "chunk_id": [0], "id": "two_fingers", "name": "Two Fingers", "states": [], "type": "group"}, "font": {"color": "white"}, "id": "two_fingers", "label": "Two Fingers", "shape": "dot"}, {"color": "#ffa94d", "data": {"base_attributes": {}, "base_description": "The Golden Order is a human system of beliefs that helps enact the Greater Will\u0027s desires.", "chunk_id": [0], "id": "golden_order", "name": "Golden Order", "states": [], "type": "group"}, "font": {"color": "white"}, "id": "golden_order", "label": "Golden Order", "shape": "dot"}, {"color": "#4dabf7", "data": {"base_attributes": {}, "base_description": "The Lands Between is the main setting, first ruled by dragons, later by Marika and the Golden Order.", "chunk_id": [0], "id": "lands_between", "name": "Lands Between", "states": [], "type": "location"}, "font": {"color": "white"}, "id": "lands_between", "label": "Lands Between", "shape": "dot"}, {"color": "#ff6b6b", "data": {"base_attributes": {}, "base_description": "Dragonlord Placidusax is the former lord of the dragons who ruled the Lands Between.", "chu  to search for a cure for Malenia\u0027s scarlet rot.", "chunk_id": [4], "id": "haligtree", "name": "Haligtree", "states": [{"current_attributes": {}, "current_description": "The Haligtree is an artificial Erdtree created by Miquella as a refuge for the discriminated and to cure Malenia. It is separate from and opposes the Golden Order\u0027s Erdtree.", "sid": "state_haligtree_001", "time_end_event": null, "time_start_event": null}], "type": "environment_element"}, "font": {"color": "white"}, "id": "haligtree", "label": "Haligtree", "shape": "dot"}, {"color": "#ff6b6b", "data": {"base_attributes": {}, "base_description": "The Elden Beast is a vassal of the Greater Will sent within a star, later absorbed into Queen Marika\u0027s body.", "chunk_id": [0], "id": "elden_beast", "name": "Elden Beast", "states": [], "type": "character"}, "font": {"color": "white"}, "id": "elden_beast", "label": "Elden Beast", "shape": "dot"}, {"color": "#ffa94d", "data": {"base_attributes": {}, "base_description": "The Numen are a race that originated outside the Lands Between; Queen Marika is descended from them.", "chunk_id": [0], "id": "numen", "name": "Numen", "states": [], "type": "group"}, "font": {"color": "white"}, "id": "numen", "label": "Numen", "shape": "dot"}, {"color": "#4dabf7", "data": {"base_attributes": {}, "base_description": "Leyndell is the capital established by Marika after becoming the Greater Will\u0027s vassal.", "chunk_id": [0], "id": "leyndell", "name": "Leyndell", "states": [], "type": "location"}, "font": {"color": "white"}, "id": "leyndell", "label": "Leyndell", "shape": "dot"}, {"color": "#ff6b6b", "data": {"base_attributes": {}, "base_description": "Godwyn is Marika\u0027s son, befriended the dragon Fortissax. He was killed during the Night of the Black Knives, later worshiped as the Prince of Death.", "chunk_id": [0, 5, 7], "id": "godwyn_the_golden", "name": "Godwyn the Golden", "states": [{"current_attributes": {}, "current_description": "Godwyn the Golden is Marika\u0027s living son, who befriended the dragon Fortissax. He is alive and well.", "sid": "state_godwyn_001", "time_end_event": "night_of_the_black_knives", "time_start_event": null}, {"current_attributes": {}, "current_description": "Godwyn the Golden is dead. His body is entwined with the roots of the Erdtree under the capital in Deeproot Depths. He is worshiped as the Prince of Death, and his death causes deathroot to sprout.", "sid": "state_godwyn_002", "time_end_event": null, "time_start_event": "night_of_the_black_knives"}], "type": "character"}, "font": {"color": "white"}, "id": "godwyn_the_golden", "label": "Godwyn the Golden", "shape": "dot"}, {"color": "#ff6b6b", "data": {"base_attributes": {}, "base_description": "Fortissax is a dragon befriended by Godwyn.", "chunk_id": [0], "id": "fortissax", "name": "Fortissax", "states": [], "type": "character"}, "font": {"color": "white"}, "id": "fortissax", "label": "Fortissax", "shape": "dot"}, {"color": "#ffa94d", "data": {"base_attributes": {}, "base_description": "Omens are those born with signs of the crucible (horns, tails). Before the Golden Order it was a blessing, later a curse.", "chunk_id": [0], "id": "omens", "name": "omens", "states": [], "type": "group"}, "font": {"color": "white"}, "id": "omens", "label": "omens", "shape": "dot"}, {"color": "#ff6b6b", "data": {"base_attributes": {}, "base_description": "Maliketh is Marika\u0027s half-brother and Shadow, the keeper of the Rune of Death. He slew the Gloam-Eyed Queen. After the Night of the Black Knives, he became Gurranq.", "chunk_id": [0, 4, 8], "id": "maliketh", "name": "Maliketh", "states": [{"current_attributes": {}, "current_description": "Maliketh is Marika\u0027s half-brother and Shadow, the loyal keeper of the Rune of Death. He slew the Gloam-Eyed Queen. He has not yet been betrayed.", "sid": "state_maliketh_001", "time_end_event": "night_of_the_black_knives", "time_start_event": null}, {"current_attributes": {}, "current_description": "Maliketh, now also known as Gurranq, is Marika\u0027s half-brother and Shadow who lost the Rune of Death during the Night of the Black Knives. He takes penance and constantly fights the urge to feed on death, seeking deathroot.", "sid": "state_maliketh_002", "time_end_event": null, "time_start_event": "night_of_the_black_knives"}], "type": "character"}, "font": {"color": "white"}, "id": "maliketh", "label": "Maliketh", "shape": "dot"}, {"color": "#ff6b6b", "data": {"base_attributes": {}, "base_description": "The Gloam-Eyed Queen (also Dusk-Eyed Queen) is a goddess of death, leader of the Godskin Apostles. She held the Rune of Death before Maliketh slew her.", "chunk_id": [0], "id": "gloam_eyed_queen", "name": "Gloam-Eyed Queen", "states": [], "type": "character"}, "font": {"color": "white"}, "id": "gloam_eyed_queen", "label": "Gloam-Eyed Queen", "shape": "dot"}, {"color": "#ffa94d", "data": {"base_attributes": {}, "base_description": "The Fire Giants are followers of the One-Eyed Fell God. Marika waged war on them because of their Forged Flame that could burn the Erdtree.", "chunk_id": [0], "id": "fire_giants", "name": "Fire Giants", "states": [{"current_attributes": {}, "current_description": "The Fire Giants are followers of the One-Eyed Fell God, a powerful force with a forge that can burn the Erdtree.", "sid": "state_fire_giants_001", "time_end_event": "shattering", "time_start_event": null}, {"current_attributes": {}, "current_description": "The Fire Giants are nearly extinct. Only one cursed survivor remains, forced to tend the Forge of the Giants for eternity. The Trolls betrayed them and allied with Marika.", "sid": "state_fire_giants_002", "time_end_event": null, "time_start_event": "shattering"}], "type": "group"}, "font": {"color": "white"}, "id": "fire_giants", "label": "Fire Giants", "shape": "dot"}, {"color": "#ff6b6b", "data": {"base_attributes": {}, "base_description": "Radagon is a general under Marika, later her second consort. He is the other half of Marika (\u0027Radagon is Marika\u0027). He married Rennala, then left her to marry Marika.", "chunk_id": [0, 1, 4], "id": "radagon", "name": "Radagon", "states": [{"current_attributes": {}, "current_description": "Radagon is a general under Marika. He is married to Rennala of the Carian kingdom and has three children: Radahn, Rykard, and Ranni. He has not yet left Rennala.", "sid": "state_radagon_001", "time_end_event": "shattering", "time_start_event": null}, {"current_attributes": {}, "current_description": "Radagon is Marika\u0027s second consort and the other half of Marika (\u0027Radagon is Marika\u0027). He left Rennala to marry Marika. He and Marika have children Malenia and Miquella.", "sid": "state_radagon_002", "time_end_event": "shattering", "time_start_event": "shattering"}, {"current_attributes": {}, "current_description": "Radagon is imprisoned within the Erdtree along with Marika. He attempted to repair the shattered Elden Ring but failed. He is no longer free.", "sid": "state_radagon_003", "time_end_event": null, "time_start_event": "shattering"}], "type": "character"}, "font": {"color": "white"}, "id": "radagon", "label": "Radagon", "shape": "dot"}, {"color": "#ff6b6b", "data": {"base_attributes": {}, "base_description": "Hoarah Loux is a chieftain of the Badlands, a general for Marika who later rebranded as Godfrey. He became the first Tarnished and was banished.", "chunk_id": [0, 2], "id": "hoarah_loux", "name": "Hoarah Loux", "states": [{"current_attributes": {}, "current_description": "Hoarah Loux is a chieftain of the Badlands and a general serving Marika. He is known as Godfrey, the first Elden Lord, and is married to Marika. He has children Godwyn, Morgott, and Mohg.", "sid": "state_hoarah_loux_001", "time_end_event": "shattering", "time_start_event": null}, {"current_attributes": {}, "current_description": "Hoarah Loux (Godfrey) is the first Tarnished, banished from the Lands Between. He no longer has the blessing of grace. He later returns as a Tarnished seeking to reclaim his title.", "sid": "state_hoarah_loux_002", "time_end_event": null, "time_start_event": "shattering"}], "type": "character"}, "font": {"color": "white"}, "id": "hoarah_loux", "label": "Hoarah Loux", "shape": "dot"}, {"color": "#ffa94d", "data": {"base_attributes": {}, "base_description": "The trolls are beings who betrayed the Fire Giants and allied with Marika. They have holes in their stomachs where the eye of the Fell God used to be.", "chunk_id": [0], "id": "trolls", "name": "trolls", "states": [], "type": "group"}, "font": {"color": "white"}, "id": "trolls", "label": "trolls", "shape": "dot"}, {"color": "#ff6b6b", "data": {"base_attributes": {}, "base_description": "Morgott is Marika\u0027s son, an Omen twin with Mohg. He was banished but later took over the Capital, remaining a true believer in the Golden Order. Also known as Margit.", "chunk_id": [0, 5], "id": "morgott", "name": "Morgott", "states": [{"current_attributes": {}, "current_description": "Morgott is Marika\u0027s son, an Omen twin with Mohg. He is banished due to being born with horns, considered cursed. He is not yet the ruler of Leyndell.", "sid": "state_morgott_001", "time_end_event": "shattering_war", "time_start_event": null}, {"current_attributes": {}, "current_description": "Morgott is the secret ruler of Leyndell, using the alias Margit the Fell when needed. He is a true believer in the Golden Order despite his curse. He defended the Capital during the Shattering.", "sid": "state_morgott_002", "time_end_event": null, "time_start_event": "shattering_war"}], "type": "character"}, "font": {"color": "white"}, "id": "morgott", "label": "Morgott", "shape": "dot"}, {"color": "#ff6b6b", "data": {"base_attributes": {}, "base_description": "Mohg is Marika\u0027s son, an Omen twin with Morgott. He resented his banishment and fell into league with the Formless Mother.", "chunk_id": [0, 5], "id": "mohg", "name": "Mohg", "states": [{"current_attributes": {}, "current_description": "Mohg is Marika\u0027s son, an Omen twin with Morgott. He resents his banishment and eventually falls into league with the Formless Mother, an Outer God of blood.", "sid": "state_mohg_001", "time_end_event": "shattering", "time_start_event": null}, {"current_attributes": {}, "current_description": "Mohg is in league with the Formless Mother. He stole Miquella with the intent of making him a puppet ruler, acting as his consort, but Miquella rejects this.", "sid": "state_mohg_002", "time_end_event": null, "time_start_event": "shattering_war"}], "type": "character"}, "font": {"color": "white"}, "id": "mohg", "label": "Mohg", "shape": "dot"}, {"color": "#4dabf7", "data": {"base_attributes": {}, "base_description": "Nokron is one of the twin underground cities of the Nox, destroyed by beasts carried on falling stars.", "chunk_id": [0], "id": "nokron", "name": "Nokron", "states": [], "type": "location"}, "font": {"color": "white"}, "id": "nokron", "label": "Nokron", "shape": "dot"}, {"color": "#4dabf7", "data": {"base_attributes": {}, "base_description": "Nokstella is one of the twin underground cities of the Nox, destroyed by beasts carried on falling stars.", "chunk_id": [0], "id": "nokstella", "name": "Nokstella", "states": [], "type": "location"}, "font": {"color": "white"}, "id": "nokstella", "label": "Nokstella", "shape": "dot"}, {"color": "#ffa94d", "data": {"base_attributes": {}, "base_description": "The Nox are individuals who created the fingerslayer blade and were banished underground for alchemy the Greater Will disapproved of.", "chunk_id": [0], "id": "nox", "name": "Nox", "states": [], "type": "group"}, "font": {"color": "white"}, "id": "nox", "label": "Nox", "shape": "dot"}, {"color": "#ffa94d", "data": {"base_attributes": {}, "base_description": "The Carian kingdom is a neighboring kingdom to Leyndell, led by Queen Rennala, known for sorcery.", "chunk_id": [0], "id": "carian_kingdom", "name": "Carian kingdom", "states": [], "type": "group"             }
            #infoPanel h3 {
                margin: 0 0 10px 0;
                font-size: 15px;
            }
            </style>
            <div id="infoPanel"></div>
            <script>
            function showPanel(title, data) {
                const panel = document.getElementById("infoPanel");
                panel.style.display = "block";
                panel.innerHTML = "<h3>" + title + "</h3>" +
                                "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
            }

            function hidePanel() {
                document.getElementById("infoPanel").style.display = "none";
            }
            setTimeout(() => {
                if (!window.network) return;
                network.on("click", function (params) {
                    if (params.nodes.length === 0 && params.edges.length === 0) {
                        hidePanel();
                        return;
                    }
                    if (params.nodes.length === 1) {
                        const nodeId = params.nodes[0];
                        const node = network.body.data.nodes.get(nodeId);
                        showPanel("Node: " + nodeId, node.data || {});
                        return;
                    }
                    if (params.edges.length === 1) {
                        const edgeId = params.edges[0];
                        const edge = network.body.data.edges.get(edgeId);
                        showPanel("Edge: " + edge.from + " → " + edge.to, edge.data || {});
                        return;
                    }
                });

            }, 300);
            </script>
        
</body>
</html>
